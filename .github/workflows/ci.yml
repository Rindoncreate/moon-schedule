name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
      - run: moon check --target all --deny-warn
      - run: moon build --target all --deny-warn
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code
      - run: moon test --target all --deny-warn
      - run: moon package
